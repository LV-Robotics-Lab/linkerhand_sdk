name: CPU contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile lab-maintained entry points
        run: >-
          python -m py_compile
          linker_hand_l6.py dual_gui.py diagnose.py gestures.py test_hand.py
          LinkerHand/utils/open_can.py
      - name: Repository contract
        run: python -m unittest discover -s tests -v
